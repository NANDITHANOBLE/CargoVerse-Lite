<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — CargoVerse Lite</title>
  <meta name="description" content="Stay updated on bookings, payments, and shipments.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="app-main page-fade">

      <div class="dashboard-header">
        <div class="dashboard-greeting">
          <div>
            <h1>Notifications</h1>
            <div class="subtitle">Stay updated on bookings, payments, and shipments</div>
          </div>
        </div>
      </div>

      <div class="card">

        <div class="notif-header-row">
          <div class="bell-row">
            <div class="bell-icon-wrap">
              <span id="bellIcon"></span>
              <span id="badge" class="badge" style="display:none;">0</span>
            </div>
            <span class="bell-row-text">Click a notification to mark it as read</span>
          </div>

          <div class="notif-actions">
            <button class="btn btn-ghost" id="markAllReadBtn"></button>
            <button class="btn btn-outline" id="refreshBtn"></button>
          </div>
        </div>

        <div id="notificationList" class="notification-list"></div>

      </div>

    </main>
  </div>

  <div id="logout-modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/auth-state.js"></script>
  <script src="js/logout-modal.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/home.js"></script>
  <script src="js/notifications.js"></script>


</body></html>
