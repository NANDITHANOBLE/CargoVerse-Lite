<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipment Tracking — CargoVerse Lite</title>
  <meta name="description" content="Track the live status of your cargo shipment from booking to delivery.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tracking.css">
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="app-main page-fade">

      <div class="dashboard-header">
        <div class="dashboard-greeting">
          <div>
            <h1>Shipment Tracking</h1>
            <div class="subtitle">Live status of your bookings</div>
          </div>
        </div>
      </div>

      <div class="card">

        <div class="tracking-search-row">
          <div class="input-with-icon">
            <span id="bookingIdIcon"></span>
            <input type="text" id="bookingId" placeholder="Enter Booking ID">
          </div>
          <button class="btn btn-outline" id="refreshBtn"></button>
          <button class="btn btn-primary" id="advanceStatusBtn"></button>
        </div>

        <div class="progress-container" id="progressContainer">
          <div class="progress-header">
            <span class="booking-id-tag" id="bookingIdTag">No booking selected</span>
          </div>

          <div class="progress-bar-track">
            <div id="progressFill" class="progress-bar-fill"></div>
          </div>

          <div class="status-label">
            <span id="statusLabelIcon"></span>
            <span id="statusLabelText">Enter a Booking ID to begin tracking</span>
          </div>

          <div class="steps-row" id="stepsRow"></div>
        </div>

      </div>

    </main>
  </div>

  <div id="logout-modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/auth-state.js"></script>
  <script src="js/logout-modal.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/home.js"></script>
  <script src="js/tracking.js"></script>


</body></html>
