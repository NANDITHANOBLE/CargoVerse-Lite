<html lang="en"><head>
  <meta charset="UTF-8">
  <title>Checkout - CargoVerse AI Lite</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/booking-checkout.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="page-content checkout-wrap">

    <!-- STEP 1: Review and enter weight -->
    <div id="step1" class="checkout-step active glass-card fade-up">
      <h1 style="font-size:22px; color:var(--cyber-cyan); margin-bottom:16px;">Review Your Booking</h1>

      <div class="form-group">
        <label>Cargo Weight (tons)</label>
        <input type="number" id="weightInput" placeholder="e.g. 3" min="0.1" step="0.1">
      </div>

      <div style="margin-top:20px;">
        <div class="checkout-summary-row"><span>Volume</span><span id="sumVolume">-</span></div>
        <div class="checkout-summary-row"><span>Base Amount</span><span id="sumBase">-</span></div>
        <div class="checkout-summary-row"><span>GST (18%)</span><span id="sumGst">-</span></div>
        <div class="checkout-summary-row"><span>Insurance (2%)</span><span id="sumInsurance">-</span></div>
        <div class="checkout-summary-row"><span>Documentation Fee</span><span id="sumDocFee">-</span></div>
        <div class="checkout-summary-row total"><span>Total</span><span id="sumTotal">-</span></div>
      </div>

      <button id="confirmBookingBtn" class="btn btn-primary" style="width:100%; padding:12px; margin-top:20px;">Confirm Booking</button>
    </div>

    <!-- STEP 2: Payment -->
    <div id="step2" class="checkout-step glass-card fade-up">
      <h1 style="font-size:22px; color:var(--cyber-cyan); margin-bottom:16px;">Complete Payment</h1>
      <p style="color:var(--text-dim); font-size:13px; margin-bottom:20px;">Booking confirmed! Click below to simulate payment via our mock gateway.</p>
      <button id="payNowBtn" class="btn btn-primary" style="width:100%; padding:12px;">Pay Now</button>
    </div>

    <!-- STEP 3: Success -->
    <div id="step3" class="checkout-step glass-card fade-up">
      <div class="success-icon">✅</div>
      <div class="success-title">Payment Successful!</div>
      <div class="success-sub">Transaction Ref: <span id="txnRef"></span></div>

      <div class="action-row">
        <a href="dashboard-trader.html" class="btn btn-ghost">Back to Dashboard</a>
        <button onclick="goToTracking()" class="btn btn-primary">Track Shipment</button>
      </div>
    </div>

  </main>

  <div id="app-footer"></div>

  
  
  
  
  

</body></html>
