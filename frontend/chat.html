<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — CargoVerse Lite</title>
  <meta name="description" content="Chat directly with your trading partners and cargo providers.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="app-main page-fade">

      <div class="dashboard-header">
        <div class="dashboard-greeting">
          <div>
            <h1>Messages</h1>
            <div class="subtitle">Chat directly with your trading partners</div>
          </div>
        </div>
      </div>

      <div class="chat-layout">

        <!-- ===== Conversation List Pane ===== -->
        <div class="conversation-list-pane" id="conversationListPane">
          <div class="conversation-list-header">
            <h3><span id="conversationListIcon"></span> Conversations</h3>
            <div class="conversation-search">
              <span id="conversationSearchIcon"></span>
              <input type="text" id="conversationSearch" placeholder="Search conversations...">
            </div>
          </div>

          <div class="conversation-list" id="conversationList"></div>

          <form id="newChatForm" class="new-chat-form">
            <input type="text" id="newChatUserId" placeholder="Start chat with User ID...">
            <button type="submit" class="btn btn-primary" id="newChatIcon"></button>
          </form>
        </div>

        <!-- ===== Active Chat Pane ===== -->
        <div class="active-chat-pane" id="activeChatPane">

          <!-- Shown when no conversation is selected -->
          <div class="chat-empty-state" id="chatEmptyPlaceholder">
            <div class="icon-wrap" id="chatEmptyIcon"></div>
            <h3 style="font-size:1rem; margin-bottom:6px;">Select a conversation</h3>
            <p style="font-size:0.85rem;">Choose an existing chat or start a new one to begin messaging.</p>
          </div>

          <div class="active-chat-header" style="display:none;" id="activeChatHeader">
            <button class="back-to-list-btn" id="backToListBtn"></button>
            <div class="conversation-avatar" id="activeChatAvatar"></div>
            <div class="conversation-name" id="activeChatName"></div>
          </div>

          <div id="chatWindow" class="chat-window"></div>
          <div id="typingIndicator" class="typing-indicator"></div>

          <div class="message-input-row">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendBtn"></button>
          </div>
        </div>

      </div>

    </main>
  </div>

  <div id="logout-modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/auth-state.js"></script>
  <script src="js/logout-modal.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/home.js"></script>
  <script src="js/chat.js"></script>


</body></html>
