<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Onboarding — CargoVerse Lite</title>
  <meta name="description" content="Complete your provider profile to list cargo space on CargoVerse Lite.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/provider-onboarding.css">
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="app-main page-fade onboard-wrap">

      <div class="card">

        <!-- ===== Onboarding Form ===== -->
        <form id="onboardForm">
          <div class="onboard-head">
            <div class="icon-wrap" id="onboardHeadIcon"></div>
            <h1>Complete Your Provider Profile</h1>
            <div class="subtitle">Submit your details to list cargo space on CargoVerse</div>
          </div>

          <div id="authError" class="auth-error"></div>

          <div class="form-grid-2">
            <div class="form-group full-width">
              <label for="companyName">Company Name</label>
              <div class="input-with-icon">
                <span id="companyNameIcon"></span>
                <input type="text" id="companyName" required="" placeholder="e.g. Kumar Logistics">
              </div>
            </div>

            <div class="form-group">
              <label for="gstNumber">GST Number</label>
              <div class="input-with-icon">
                <span id="gstIcon"></span>
                <input type="text" id="gstNumber" required="" placeholder="29ABCDE1234F1Z5">
              </div>
            </div>

            <div class="form-group">
              <label for="panNumber">PAN Number</label>
              <div class="input-with-icon">
                <span id="panIcon"></span>
                <input type="text" id="panNumber" required="" placeholder="ABCDE1234F">
              </div>
            </div>

            <div class="form-group">
              <label for="fleetSize">Fleet Size</label>
              <div class="input-with-icon">
                <span id="fleetSizeIcon"></span>
                <input type="number" id="fleetSize" required="" placeholder="e.g. 12">
              </div>
            </div>

            <div class="form-group">
              <label for="transportMode">Transport Mode</label>
              <select id="transportMode" required="" style="width:100%; padding:11px 14px; background:var(--background); border:1px solid var(--border); border-radius:var(--radius); color:var(--text);">
                <option value="road">Road</option>
                <option value="rail">Rail</option>
                <option value="sea">Sea</option>
                <option value="air">Air</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitProfileBtn" style="margin-top:24px;"></button>
        </form>

        <!-- ===== Pending / Status View ===== -->
        <div id="pendingView" class="pending-view" style="display:none;">
          <div class="pending-icon-wrap" id="pendingIconWrap"></div>
          <h2 class="pending-company-name" id="pendingCompanyName"></h2>
          <div id="statusBadge" class="pending-status-badge"></div>

          <div class="status-timeline" id="statusTimeline"></div>

          <p class="pending-message" id="pendingMessage"></p>
          <a id="goToDashboardBtn" href="dashboard.html" class="btn btn-primary" style="display:none;"></a>
        </div>

      </div>

    </main>
  </div>

  <div id="logout-modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/auth-state.js"></script>
  <script src="js/logout-modal.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/home.js"></script>
  <script src="js/provider-onboarding.js"></script>


</body></html>
