<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Containers — CargoVerse Lite</title>
  <meta name="description" content="List and manage your cargo space on CargoVerse Lite.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/my-containers.css">
</head>
<body>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="app-main page-fade">

      <div class="dashboard-header">
        <div class="dashboard-greeting">
          <div>
            <h1>My Containers</h1>
            <div class="subtitle">List and manage your cargo space</div>
          </div>
        </div>
      </div>

      <!-- ===== Add Container Form ===== -->
      <div class="card" style="margin-bottom:24px;">
        <div class="section-card-title">
          <span id="sectionAddIcon"></span> Add New Container
        </div>

        <div id="formError" class="form-error-box"></div>

        <form id="addContainerForm" class="add-container-form">
          <div class="form-group">
            <label for="mode">Mode</label>
            <select id="mode" required="">
              <option value="road">Road</option>
              <option value="rail">Rail</option>
              <option value="sea">Sea</option>
              <option value="air">Air</option>
            </select>
          </div>

          <div class="form-group">
            <label for="origin">Origin</label>
            <div class="input-with-icon">
              <span id="originIcon"></span>
              <input type="text" id="origin" required="" placeholder="Chennai">
            </div>
          </div>

          <div class="form-group">
            <label for="destination">Destination</label>
            <div class="input-with-icon">
              <span id="destinationIcon"></span>
              <input type="text" id="destination" required="" placeholder="Singapore">
            </div>
          </div>

          <div class="form-group">
            <label for="departureDate">Departure Date</label>
            <input type="datetime-local" id="departureDate" required="" style="width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--background); color:var(--text); font-size:0.88rem;">
          </div>

          <div class="form-group">
            <label for="capacityTons">Capacity (tons)</label>
            <div class="input-with-icon">
              <span id="capacityIcon"></span>
              <input type="number" id="capacityTons" required="" placeholder="28">
            </div>
          </div>

          <div class="form-group">
            <label for="availableSpace">Available Space (CBM)</label>
            <div class="input-with-icon">
              <span id="availableSpaceIcon"></span>
              <input type="number" id="availableSpace" required="" placeholder="10">
            </div>
          </div>

          <div class="form-group">
            <label for="pricePerCbm">Price per CBM</label>
            <div class="input-with-icon">
              <span id="priceIcon"></span>
              <input type="number" id="pricePerCbm" required="" placeholder="6500">
            </div>
          </div>

          <div class="form-group">
            <label for="transitDays">Transit Days</label>
            <div class="input-with-icon">
              <span id="transitDaysIcon"></span>
              <input type="number" id="transitDays" required="" placeholder="5">
            </div>
          </div>

          <div class="submit-wrap">
            <button type="submit" class="btn btn-primary" id="addContainerBtn"></button>
          </div>
        </form>
      </div>

      <!-- ===== Listed Containers ===== -->
      <div class="card">
        <div class="section-card-title">
          <span id="sectionListIcon"></span> Your Listed Containers
        </div>
        <div id="containersList"></div>
      </div>

    </main>
  </div>

  <div id="logout-modal-root"></div>
  <div id="edit-space-modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/auth-state.js"></script>
  <script src="js/logout-modal.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/home.js"></script>
  <script src="js/my-containers.js"></script>


</body></html>
