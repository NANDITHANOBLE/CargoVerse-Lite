<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CargoVerse Lite</title>
  <meta name="description" content="Log in to your CargoVerse Lite account to manage bookings, track shipments, and access AI tools.">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div id="header-root"></div>

  <main>
    <section class="hero" style="padding: 40px 24px 60px; min-height: 70vh; display: flex; align-items: center;">
      <div id="particles-root"></div>

      <div class="auth-wrap" style="position: relative; z-index: 1; margin: 0 auto;">
        <div class="auth-card card page-fade">

          <div class="auth-head">
            <div class="icon-wrap" id="authHeadIcon"></div>
            <h1>Welcome back</h1>
            <p>Log in to manage your bookings and shipments</p>
          </div>

          <div id="authError" class="auth-error">
            <span id="authErrorText"></span>
          </div>

          <form id="loginForm">
            <div class="form-group">
              <label for="email">Email Address</label>
              <div class="input-with-icon">
                <span id="emailIcon"></span>
                <input type="email" id="email" placeholder="you@company.com" required="" autocomplete="email">
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-with-icon">
                <span id="passwordIcon"></span>
                <input type="password" id="password" placeholder="Enter your password" required="" autocomplete="current-password">
                <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Toggle password visibility"></button>
              </div>
            </div>

            <div class="form-row-check">
              <label>
                <input type="checkbox" id="rememberMe">
                Remember me
              </label>
              <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">
              <span class="btn-spinner"></span>
              <span class="btn-label-text">Log In</span>
            </button>
          </form>

          <div class="auth-divider">New to CargoVerse?</div>

          <a href="register.html" class="btn btn-outline btn-full">Create an Account</a>

        </div>

        <div class="auth-switch" style="margin-top: 20px;">
          <a href="index.html">← Back to Home</a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>
  <div id="logout-modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/auth-state.js"></script>
  <script src="js/logout-modal.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/home.js"></script>
  <script src="js/login.js"></script>


</body></html>
